name: Check

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        pi: ['1.0.0', '1.0.4']
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.19.0'
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: npm install --prefix "$RUNNER_TEMP/stock-pi" --ignore-scripts --no-save --no-package-lock "@earendil-works/pi-coding-agent@${{ matrix.pi }}"
      - run: sudo apt-get update && sudo apt-get install -y tmux
      - run: pnpm test:tui
        env:
          PI_SIDEBAR_TEST_PI: ${{ runner.temp }}/stock-pi/node_modules/.bin/pi
