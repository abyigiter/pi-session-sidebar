name: Check

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.19.0'
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm setup:core
      - run: npm run check
        working-directory: .pi-core
      - run: node ../../node_modules/vitest/dist/cli.js --run test/sidebar-layout.test.ts test/chat-viewport.test.ts test/interactive-mode-status.test.ts test/extensions-runner.test.ts
        working-directory: .pi-core/packages/coding-agent
      - run: node --test test/sidebar-input.test.ts test/tui-alt-screen.test.ts
        working-directory: .pi-core/packages/tui
      - run: sudo apt-get update && sudo apt-get install -y tmux
      - run: pnpm test:tui
